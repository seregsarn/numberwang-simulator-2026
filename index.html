<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numberwang Simulator 2026</title>
  <link rel="StyleSheet" href="index.css"/>
  <script src="sounds.js"></script>
</head>
<body>

<div class="container">
  <h1>Numberwang Simulator 2026</h1>
  <!-- Sound indicator cards -->
  <div class="sound-row">
    <label>Maximum Number <span><span id="sound-out">4</span></span></label>
    <input type="range" id="sound-count" min="1" max="20" value="4" step="1">
  </div>

  <div class="grid-5" id="cards"></div>

  <!-- Delay controls -->
  <div class="delay-row">
    <label>Min delay <span><span id="min-out">3</span>s</span></label>
    <input type="range" id="min-delay" min="1" max="60" value="3" step="1">
  </div>
  <div class="delay-row">
    <label>Max delay <span><span id="max-out">8</span>s</span></label>
    <input type="range" id="max-delay" min="1" max="60" value="8" step="1">
  </div>

  <div class="btn-row">
    <button id="start-btn" onclick="handleStart()">▶ Start</button>
    <button id="stop-btn"  onclick="handleStop()" disabled>■ Stop</button>
  </div>

  <div class="status" id="status">Ready. Press Start to begin.</div>
  <div class="credits">Made by <a href="https://github.com/seregsarn/">thp</a>. GPL source available on <a href="https://github.com/seregsarn/numberwang-simulator-2026">github</a>.</div>
</div>

<script src="index.js"></script>

</body>
</html>
